<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Inverter Load Balancer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>APPLICATIONS</h1>
    <nav>
    <h2>Total Capacity : 800w</h2>

        wattage : 300w

        </label>
        <br>
        <label for="Shed">Shed
            <input type="radio">
        </label>
        <br>
        <label for="Off">off
            <input type="radio">
        </label>
    </section>

    <section>

        <label for="Shed">Shed
            <input type="radio">
        </label>
        <br>
        <label for="Off">off
            <input type="radio">

   <hr>

        <br>

            <input type="radio">
        </label>
        <br>
        <label for="Off">OFF
            <input type="radio">
        </label>
    </section>
    <hr>
    </nav>
</body>
</html>
